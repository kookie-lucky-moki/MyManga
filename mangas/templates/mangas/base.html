<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MyManga</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">MyManga</a>

    <div class="d-flex ms-auto align-items-center gap-3">
      
      <form action="{% url 'search' %}" method="GET" class="d-flex" role="search">
        <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Buscar mangas..." aria-label="Buscar">
        <button class="btn btn-outline-light btn-sm" type="submit">Buscar</button>
      </form>

      <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <span class="text-white me-3">¡Hola, {{ user.username }}!</span>
          <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Registro</a>
        {% endif %}
      </div>

    </div>
  </div>
</nav>
<div class="container mt-4">
    {% block content %}
    
    {% endblock %}

    <footer class="py-5 text-center text-body-secondary bg-body-tertiary">
        <p>Copyright (c) 2026 - MyMangas by Equipo #6. </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
    
</div>

</body>
</html>
