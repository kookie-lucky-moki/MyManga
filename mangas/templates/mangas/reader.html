{% extends 'mangas/base.html' %}

{% block content %}

<h2>
    {{ chapter.manga.title }}
    - Capitulo {{ chapter.number }}
</h2>

<div class="text-center">

    {% for page in chapter.pages.all %}

        <img
            src="{{ page.image.url }}"
            class="img-fluid mb-3"
        >

    {% endfor %}

</div>

{% endblock %}
